<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b100d">
  <link rel="icon" href="/static/images/favicon.svg" type="image/svg+xml">
  <meta name="description" content="TaskChain workspace for requests, assignment, handover, evidence, verification and security monitoring.">
  <meta name="color-scheme" content="dark light">
  <title>Dashboard — TaskChain</title>
  <script src="/static/js/core/theme-init.js"></script>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <!-- Global route progress bar -->
  <div id="routeProgress" class="route-progress" aria-hidden="true"><span></span></div>

  <!-- Accessibility Skip Link -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Global Toast Notification -->
  <div id="toast" class="toast" role="alert" aria-live="polite" aria-atomic="true"></div>

  <!-- Custom Modal Container -->
  <div id="modalContainer"></div>
  <!-- Slide-Over Drawer Container -->
  <div id="drawerContainer"></div>

  <!-- Mobile navigation scrim -->
  <div class="sidebar-scrim" id="sidebarScrim" aria-hidden="true"></div>

  <div class="app-shell">

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
        </div>
        <div class="brand-info">
          <div class="brand-header-row">
            <strong>TaskChain</strong>
            <span class="env-badge">ENTERPRISE</span>
          </div>
          <span class="brand-sub">Connected work, verified.</span>
        </div>
      </div>

      <!-- Main Navigation Menu (injected by app.js) -->
      <nav class="nav" id="nav" aria-label="Main Navigation"></nav>

      <!-- User Profile & Session Controls -->
      <div class="sidebar-bottom">
        <div class="mini-user" id="userProfileCard" title="View account details">
          <div class="avatar-container">
            <div class="avatar" id="avatar" aria-hidden="true">U</div>
            <span class="status-pulse" title="Online"></span>
          </div>
          <div class="mini-user-info">
            <strong id="sideName">Loading…</strong>
            <span class="role-pill" id="sideRole">Role</span>
          </div>
        </div>

        <button class="btn ghost full logout-btn" id="logoutBtn" title="Sign out of your session">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Sign out
        </button>
      </div>
    </aside>

    <!-- Main Application View Area -->
    <main class="main" id="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn mobile-only" id="menuBtn" aria-label="Open navigation menu" aria-expanded="false" aria-controls="sidebar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>

          <div class="page-title-group">
            <nav class="breadcrumb" aria-label="Breadcrumb">
              <span id="pageEyebrow">Workspace</span>
            </nav>
            <h1 id="pageTitle">Dashboard</h1>
          </div>
        </div>

        <div class="topbar-right">
          <!-- Global Search -->
          <div class="global-search-wrapper">
            <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="globalSearch" placeholder="Search tasks, codes, users…" autocomplete="off">
            <kbd class="search-kbd">⌘K</kbd>
          </div>

          <!-- Theme Switcher -->
          <button class="icon-btn" id="themeToggleBtn" aria-label="Toggle light or dark theme" title="Toggle theme (Light / Dark)">
            <svg id="themeIconDark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg id="themeIconLight" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </button>

          <!-- Notification Center -->
          <div class="notif-wrapper">
            <button class="icon-btn" id="notifBtn" aria-label="Notifications" title="Notification center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
              </svg>
              <span class="dot" id="notifDot" aria-hidden="true"></span>
              <span class="visually-hidden" id="notifCount">Notifications</span>
            </button>

            <div class="notif-dropdown" id="notifDropdown">
              <div class="notif-header">
                <strong>Notifications</strong>
                <button class="link-btn small" id="markAllReadHeader">Mark all read</button>
              </div>
              <div class="notif-list" id="notifQuickList">
                <div class="empty-notif">No new notifications.</div>
              </div>
              <div class="notif-footer">
                <button class="btn full small" id="viewAllNotifs">View all notifications</button>
              </div>
            </div>
          </div>

          <!-- User Chip -->
          <div class="user-chip" id="topUserChip" role="button" tabindex="0" title="Account settings" aria-label="Account settings">
            <div class="avatar small" id="topAvatar" aria-hidden="true">U</div>
            <div class="user-chip-text">
              <span class="user-name" id="topName">User</span>
              <span class="user-role-text" id="topRole">Role</span>
            </div>
          </div>
        </div>
      </header>

      <!-- Main Dynamic Content Workspace -->
      <section class="content" id="content" aria-live="polite"></section>
      <footer class="app-footer">© 2026 TaskChain. All rights reserved.</footer>
    </main>
  </div>

  <script src="/static/js/vendor/qrcode.js"></script>
  <script src="/static/js/core/state.js"></script>
  <script src="/static/js/core/utils.js"></script>
  <script src="/static/js/core/csrf.js"></script>
  <script src="/static/js/core/api.js"></script>
  <script src="/static/js/core/shell.js"></script>
  <script src="/static/js/components/notifications.js"></script>
  <script src="/static/js/core/router.js"></script>
  <script src="/static/js/pages/dashboard.js"></script>
  <script src="/static/js/pages/tasks.js"></script>
  <script src="/static/js/pages/new-request.js"></script>
  <script src="/static/js/components/tables.js"></script>
  <script src="/static/js/components/modals.js"></script>
  <script src="/static/js/components/custody-chain.js"></script>
  <script src="/static/js/components/collaboration.js"></script>
  <script src="/static/js/pages/task-detail.js"></script>
  <script src="/static/js/components/task-detail-parts.js"></script>
  <script src="/static/js/pages/handovers.js"></script>
  <script src="/static/js/pages/verification.js"></script>
  <script src="/static/js/pages/notifications.js"></script>
  <script src="/static/js/pages/calendar.js"></script>
  <script src="/static/js/pages/reports.js"></script>
  <script src="/static/js/pages/users.js"></script>
  <script src="/static/js/pages/audit.js"></script>
  <script src="/static/js/pages/security.js"></script>
  <script src="/static/js/pages/monitor.js"></script>
  <script src="/static/js/pages/sla-settings.js"></script>
  <script src="/static/js/main.js"></script>
</body>
</html>
</html>
