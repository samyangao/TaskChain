<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account — TaskChain</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <a href="#registerForm" class="skip-link">Skip to registration form</a>
  <main class="auth single">
    <section class="auth-card">
      <!-- Brand Section -->
      <div class="brand center">
        <div class="brand-mark">TC</div>
        <strong>TaskChain</strong>
      </div>

      <!-- Card Header -->
      <div class="card-head">
        <p class="eyebrow">Get started</p>
        <h2>Create your account</h2>
        <p>New public accounts start as Requesters. Administrators can assign other roles.</p>
      </div>

      <div id="error" class="alert"></div>

      <!-- Registration Form -->
      <form id="registerForm">
        <label for="fullName">
          Full name
          <input id="fullName" type="text" placeholder="Juan Dela Cruz" required maxlength="120">
        </label>

        <label for="email">
          Email
          <input id="email" type="email" autocomplete="username" placeholder="you@example.com" required maxlength="320">
        </label>

        <label for="password">
          Password
          <div class="password">
            <input id="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" required minlength="8">
            <button type="button" id="show">Show</button>
          </div>
        </label>

        <label for="confirm">
          Confirm password
          <input id="confirm" type="password" autocomplete="new-password" placeholder="Re-enter password" required>
        </label>

        <label class="check terms" for="terms">
          <input id="terms" type="checkbox" required> I agree to use TaskChain responsibly.
        </label>

        <button type="submit" class="primary" id="submit">Create account</button>
      </form>

      <p class="switch">Already have an account? <a href="login.html">Sign in</a></p>
    </section>
  </main>

  <script>
    // DOM Elements
    const errorAlert = document.getElementById('error');
    const registerForm = document.getElementById('registerForm');
    const fullNameInput = document.getElementById('fullName');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm');
    const termsCheckbox = document.getElementById('terms');
    const togglePassBtn = document.getElementById('show');
    const submitBtn = document.getElementById('submit');

    // Toggle Password Visibility
    togglePassBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      togglePassBtn.textContent = isPassword ? 'Hide' : 'Show';
    });

    // Form Submission & Validation
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.className = 'alert';

      // Validation Checks
      if (passwordInput.value.length < 8) {
        errorAlert.textContent = 'Password must be at least 8 characters.';
        errorAlert.className = 'alert show';
        return;
      }

      if (passwordInput.value !== confirmInput.value) {
        errorAlert.textContent = 'Passwords do not match.';
        errorAlert.className = 'alert show';
        return;
      }

      if (!termsCheckbox.checked) {
        errorAlert.textContent = 'Please accept the agreement.';
        errorAlert.className = 'alert show';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account…';

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fullName: fullNameInput.value,
            email: emailInput.value,
            password: passwordInput.value
          })
        });

        const data = await response.json();

        if (!response.ok) {
          errorAlert.textContent = data.error || 'Registration failed.';
          errorAlert.className = 'alert show';
          return;
        }

        window.location.href = `/login.html?registered=1&email=${encodeURIComponent(emailInput.value)}`;
      } catch (err) {
        errorAlert.textContent = 'Could not reach the server.';
        errorAlert.className = 'alert show';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>
